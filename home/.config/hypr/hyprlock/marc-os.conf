general {
    hide_cursor = true
    grace = 0
}

animations {
    enabled = true
    bezier = ease, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 5, ease
    animation = fadeOut, 1, 5, ease
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    brightness = $dim
    vibrancy = 0.2
}

image {
    monitor =
    path = ~/.local/state/torus/donut.png
    size = 300
    rounding = 0
    border_size = 0
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 88
    font_family = Inter Bold
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $subtext0
    font_size = 18
    font_family = Inter
    position = 0, -110
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    outer_color = $accent
    inner_color = $surface0
    font_color = $text
    check_color = $yellow
    fail_color = $red
    capslock_color = $yellow
    fade_on_empty = false
    placeholder_text = <span foreground="##$textAlpha">marc @ os</span>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    rounding = 14
    position = 0, -190
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    color = $subtext0
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -240
    halign = center
    valign = center
}
