general {
    lock_cmd = torus-lock
    before_sleep_cmd = torus-lock --immediate-render &
    after_sleep_cmd = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    inhibit_sleep = 3
}

listener {
    timeout = 60
    on-timeout = brightnessctl -s && brightnessctl s 1%
    on-resume = brightnessctl -r
}

listener {
    timeout = 120
    on-timeout = torus-lock
}

listener {
    timeout = 300
    on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "off" }))'
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'
}

listener {
    timeout = 500
    on-timeout = systemctl suspend
}

listener {
    timeout = 240
    on-timeout = torus-power on-battery && systemctl suspend
}
