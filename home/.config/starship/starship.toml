"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false
palette = "catppuccin_mocha"
format = """\
[󰣇 ](mauve)\
$directory\
$git_branch$git_commit$git_state $git_status\
$character
"""
right_format = """$kubernetes$golang$python$nodejs$rust$deno$lua$terraform$docker_context$cmd_duration"""

[directory]
style = "bold lavender"
truncation_length = 4
truncate_to_repo = true

[git_branch]
symbol = " "
style = "mauve"
format = "[$symbol$branch]($style)"

[git_status]
style = "peach"

[character]
success_symbol = "[❯](bold mauve)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

[cmd_duration]
style = "overlay1"
format = "[ $duration]($style)"

[kubernetes]
disabled = false
style = "sapphire"
format = "[󱃾 $context]($style) "

[golang]
style = "sapphire"
format = "[ $version]($style) "

[python]
style = "yellow"
format = "[ $version]($style) "

[nodejs]
style = "green"
format = "[ $version]($style) "

[rust]
style = "peach"
format = "[ $version]($style) "

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
